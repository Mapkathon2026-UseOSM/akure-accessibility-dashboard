name: Tests

# Runs the offline unit test suite (no live OSM/network calls) on every
# push and pull request, plus a manual trigger option. Covers the grid
# generation, building-density join, OSM completeness flagging, and
# multi-modal access-deficit scoring logic -- the core analytical engine
# behind the accessibility dashboard.
#
# Live-OSM integration tests (marked `@pytest.mark.integration`) are
# deliberately excluded here, since CI runners hitting the Overpass API
# / OSM network endpoints on every push would be slow, flaky, and unkind
# to a shared public resource. Run them locally with:
#     pytest -m integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Offline unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install package in editable mode
        run: pip install -e .

      - name: Run offline unit tests
        run: pytest tests/ -m "not integration" -v

      - name: Compile check (catch syntax errors in all modules)
        run: python -m py_compile akure_access/accessibility/*.py akure_access/completeness/*.py dashboard/app.py
